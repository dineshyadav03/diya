# Minimal CI: one job, no build matrix, no caching. Needs no Ollama, no network, and no live
# database -- see tests/conftest.py's isolated_environment fixture and diya_evals.py's
# assert_isolated() -- so the plain test suite runs here exactly as it does locally.
name: CI

"on":
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 3.13 is what this project is developed and tested on (see README's "Needs Python 3.10+"
      # for the floor; pyproject.toml's pins are what was actually verified working).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install ".[dev]"

      - name: Run tests
        run: python -m pytest

      # Encoding and line-ending hygiene is already a test (tests/test_text_files.py), so it runs
      # as part of the step above; no separate step needed for that one. This address scan also
      # has a pytest wrapper (tests/test_hardcoded_address_scan.py) for the ordinary local test
      # run, but it runs again here, explicitly, as its own step -- the same repo-wide check a
      # pre-push audit does by hand, now automated.
      - name: Scan for hardcoded private-network addresses
        run: python scripts/check_hardcoded_addresses.py
